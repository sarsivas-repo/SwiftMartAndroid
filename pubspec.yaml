name: swiftmart_frontend
description: "SwiftMart - Flutter Point of Sale & Inventory Management System"
publish_to: 'none'

version: 1.0.11+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  uuid: ^4.0.0
  smooth_page_indicator: ^1.1.0
  sqflite: ^2.4.2
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: ^2.7.6

flutter:
  uses-material-design: true
  assets:
    - assets/license-public-key.txt
    - assets/fonts/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
